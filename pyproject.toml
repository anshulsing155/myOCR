[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "myocr"
version = "1.0.0"
description = "Indian document intelligence pipeline — OCR to structured JSON"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Anshul Singh" }
]
keywords = ["ocr", "india", "bank-statement", "aadhaar", "pan", "document-ai", "paddleocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "paddlepaddle>=2.5.0; python_version < '3.14'",
    "paddleocr>=2.7.0; python_version < '3.14'",
    "pytesseract>=0.3.10",
    "PyMuPDF>=1.23.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pdfplumber>=0.10.0",
    "deep-translator>=1.11.0",
    "langdetect>=1.0.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
layout = [
    "layoutparser[layoutmodels]>=0.3.4",
    "torch",
    "torchvision",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/anshulsing155/myOCR"
Repository = "https://github.com/anshulsing155/myOCR"
Issues = "https://github.com/anshulsing155/myOCR/issues"

[project.scripts]
myocr = "main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
